function makePulse(c,duty){
  var n=32,real=new Float32Array(n),imag=new Float32Array(n);

}

  var osc=c.createOscillator(),g=c.createGain();
  setWave(osc,o.type||'square');
  osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(v,t+0.005);
  if(d*0.7>0.01)g.gain.exponentialRampToValueAtTime(v*0.6,t+d*0.7);
  g.gain.linearRampToValueAtTime(0.0001,t+d);
  osc.connect(g);g.connect(o.dest||AU.sfx);
  osc.start(t);osc.stop(t+d+0.05);
}

  var bars=d.lead.length,len=bars*16,steps=[],i,b,s,n,c;
  for(i=0;i<len;i++)steps.push([]);
  var toks=d.lead.join(' ').trim().split(/\s+/);
  for(i=0;i<toks.length&&i<len;i++){
    var tk=toks[i];if(tk==='.'||tk==='-')continue;
    n=1;while(i+n<toks.length&&toks[i+n]==='.')n++;
    steps[i].push({ch:'lead',m:noteMidi(tk),n:n});
  }
  for(b=0;b<bars;b++){
    var root=noteMidi(d.bass[b]),pat=d.bassPat;
    for(s=0;s<16;s++){c=pat.charAt(s);if(c==='.'||c==='-')continue;
      n=1;while(s+n<16&&pat.charAt(s+n)==='.')n++;
      steps[b*16+s].push({ch:'bass',m:root+(c==='O'?12:c==='5'?7:0),n:n});}
    if(d.chords){var cn=d.chords[b],minor=cn.length>1&&cn.charAt(cn.length-1)==='m',
      cr=noteMidi(cn.replace(/m$/,'')+'4'),iv=[0,minor?3:4,7,12];
      for(s=0;s<16;s++)steps[b*16+s].push({ch:'arp',m:cr+iv[s%4],n:1});}
    var dr=d.drums[b%d.drums.length];
    for(s=0;s<16;s++){c=dr.charAt(s);if(c==='k'||c==='s'||c==='h')steps[b*16+s].push({ch:c});}
  }
  return {bpm:d.bpm,loop:d.loop,len:len,steps:steps,tokCount:toks.length};
}
var SONGS={};
for(var sn in SONG_DEFS)if(SONG_DEFS.hasOwnProperty(sn))SONGS[sn]=compileSong(SONG_DEFS[sn]);
function mnote(m,t,d,type,v){
  var c=AU.ctx,osc=c.createOscillator(),g=c.createGain();
  setWave(osc,type);osc.frequency.setValueAtTime(mtof(m),t);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.005);
  if(d*0.7>0.01)g.gain.exponentialRampToValueAtTime(v*0.6,t+d*0.7);
  g.gain.linearRampToValueAtTime(0.0001,t+d);
  osc.connect(g);g.connect(AU.bus);osc.start(t);osc.stop(t+d+0.05);
}
function playStep(song,i,t,spb){
  var ev=song.steps[i];
  for(var k=0;k<ev.length;k++){var e=ev[k];
    switch(e.ch){
      case 'lead':mnote(e.m,t,e.n*spb*0.92,'p25',0.11);break;
      case 'bass':mnote(e.m,t,e.n*spb*0.9,'triangle',0.3);break;
      case 'arp':mnote(e.m,t,spb*0.7,'p125',0.035);break;
      case 'k':tone({f:150,f2:42,d:0.13,type:'sine',v:0.55,t:t,dest:AU.bus});break;
      case 's':noise({t:t,d:0.13,v:0.22,ff:1800,ft:'bandpass',dest:AU.bus});tone({f:190,f2:120,d:0.06,type:'triangle',v:0.15,t:t,dest:AU.bus});break;
      case 'h':noise({t:t,d:0.035,v:0.07,ff:7000,ft:'highpass',dest:AU.bus});break;
    }
  }
}
AU.play=function(name){
  AU.songName=name;AU.song=SONGS[name]||null;AU.step=0;
  var c=AU.ctx;
  if(!c){AU.pendingStart=true;AU.playing=false;return;}
  if(AU.bus){var old=AU.bus;try{old.gain.setTargetAtTime(0,c.currentTime,0.02);}catch(e){}
    setTimeout(function(){try{old.disconnect();}catch(e){}},500);}
  AU.bus=c.createGain();AU.bus.gain.value=1;AU.bus.connect(AU.music);
  AU.next=c.currentTime+0.06;AU.playing=!!AU.song;
};
AU.stop=function(){
  AU.songName='';AU.song=null;AU.playing=false;AU.pendingStart=false;
  if(AU.ctx&&AU.bus){var old=AU.bus;AU.bus=null;try{old.gain.setTargetAtTime(0,AU.ctx.currentTime,0.03);}catch(e){}
    setTimeout(function(){try{old.disconnect();}catch(e){}},500);}
};
AU.update=function(){
  var c=AU.ctx;if(!c||!AU.song||!AU.playing||AU.paused||!AU.bus)return;
  var s=AU.song,spb=60/s.bpm/4;
  if(AU.next<c.currentTime-0.25)AU.next=c.currentTime+0.05; // tab was hidden: don't burst
  while(AU.next<c.currentTime+0.15){
    playStep(s,AU.step,AU.next,spb);
    AU.next+=spb;AU.step++;
    if(AU.step>=s.len){if(s.loop)AU.step=0;else{AU.playing=false;break;}}
  }
};
function toggleMute(){
  AU.muted=!AU.muted;store('cushionman_mute',AU.muted?'1':'0');
  AU.masterLevel=AU.muted?0:0.6;
  if(AU.ctx&&AU.master){try{AU.master.gain.setTargetAtTime(AU.masterLevel,AU.ctx.currentTime,0.01);}catch(e){AU.master.gain.value=AU.muted?0:0.6;}}
  G.muteMsg=90;
}

var KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'attack',KeyJ:'attack',KeyX:'throw',KeyK:'throw',Enter:'start',NumpadEnter:'start',KeyP:'pause',
  Escape:'esc',KeyM:'mute',KeyB:'debug'};
var keysDown={},queued={},pressedNow={};
function held(a){for(var k in keysDown)if(keysDown[k]&&KEYMAP[k]===a)return true;return false;}
function pressed(a){return !!pressedNow[a];}
function codeOf(e){
  if(e.code)return e.code;
  var k=e.key||'';
  if(k===' '||k==='Spacebar')return 'Space';
  if(k==='Esc')return 'Escape';
  if(k.length===1)return 'Key'+k.toUpperCase();
  return k;
}
function keyDownCode(code){
  var a=KEYMAP[code];if(!a)return false;
  if(!keysDown[code]){queued[a]=true;if(a==='mute')toggleMute();}
  keysDown[code]=true;return true;
}
function keyUpCode(code){keysDown[code]=false;}
window.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  AU.unlock();
  if(keyDownCode(codeOf(e))&&e.preventDefault)e.preventDefault();
},false);

  var code=codeOf(e);if(KEYMAP[code]){keyUpCode(code);if(e.preventDefault)e.preventDefault();}
},false);

function newPlayer(x){return{x:x,y:GROUND,vx:0,vy:0,face:1,onGround:true,hp:MAX_HP,inv:0,hurt:0,atk:0,atkId:0,lastBossHit:-1,
  throwCd:0,throwAnim:0,slam:false,squash:0,anim:0,coyote:0,jumpBuf:0,dead:0,glide:false,bounced:false};}
var PUNCH_LEN=14;
function punchActive(p){return p.atk>=4&&p.atk<=10;}
function punchBox(p){return{x:p.face>0?p.x+2:p.x-24,y:p.y-21,w:22,h:19};}
function pBox(p){return{x:p.x-5,y:p.y-20,w:10,h:20};}
function updatePlayer(p,plats,minX,maxX){
  p.anim++;
  if(p.dead>0){p.dead++;if(p.dead===100)loseLife();return;}
  if(p.inv>0)p.inv--;
  if(p.squash>0)p.squash--;
  var ctrl=G.control&&p.hurt<=0;
  if(p.hurt>0)p.hurt--;
  var mx=0;
  if(ctrl&&!p.slam){if(held('left'))mx-=1;if(held('right'))mx+=1;}
  if(mx!==0&&(p.atk===0||p.atk>10))p.face=mx;
  if(p.hurt>0||p.slam)p.vx*=0.93;
  else if(mx!==0){p.vx+=mx*(p.onGround?0.4:0.28);p.vx=clamp(p.vx,-1.8,1.8);}
  else{p.vx*=p.onGround?0.65:0.9;if(Math.abs(p.vx)<0.05)p.vx=0;}
  var jumpHeld=held('up')||held('jump');
  if(ctrl&&(pressed('up')||pressed('jump')))p.jumpBuf=8;else if(p.jumpBuf>0)p.jumpBuf--;
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(ctrl&&p.jumpBuf>0&&p.coyote>0&&!p.slam){
    p.vy=-5.7;p.onGround=false;p.coyote=0;p.jumpBuf=0;p.bounced=false;sfx('jump');dust(p.x,p.y,3);
  }
  if(!jumpHeld&&p.vy<-2.2&&!p.bounced)p.vy=-2.2; // variable jump height
  if(ctrl&&pressed('attack')&&(p.atk===0||p.atk>10)&&!p.slam){
    if(!p.onGround&&held('down')){p.slam=true;p.vy=1.5;p.vx=0;sfx('throw');}
    else{p.atk=1;p.atkId++;sfx('punch');}
  }
  if(p.atk>0){p.atk++;if(p.atk>PUNCH_LEN)p.atk=0;}
  if(p.throwCd>0)p.throwCd--;
  if(p.throwAnim>0)p.throwAnim--;
  if(ctrl&&pressed('throw')&&p.throwCd===0&&!p.slam&&ents.cush.length<3){
    ents.cush.push({x:p.x+p.face*8,y:p.y-12,vx:p.face*3.6+p.vx*0.3,vy:-1.3,life:100,t:0});
    p.throwCd=16;p.throwAnim=10;sfx('throw');
  }
  p.glide=!p.onGround&&!p.slam&&p.vy>0&&ctrl&&jumpHeld;
  p.vy+=p.slam?0.6:0.32;
  var mf=p.slam?7:(p.glide?0.85:5.5);if(p.vy>mf)p.vy=mf;
  p.x+=p.vx;
  if(p.x<minX){p.x=minX;p.vx=0;}if(p.x>maxX){p.x=maxX;p.vx=0;}
  var prev=p.y,was=p.onGround;p.y+=p.vy;p.onGround=false;
  if(p.vy>=0){
    var land=null;
    if(p.y>=GROUND){p.y=GROUND;land={};}
    else for(var i=0;i<plats.length;i++){var pl=plats[i];
      if(p.x+4>pl.x&&p.x-4<pl.x+pl.w&&prev<=pl.y+0.01&&p.y>=pl.y){p.y=pl.y;land=pl;break;}}
    if(land){
      var impact=p.vy;p.vy=0;p.onGround=true;p.bounced=false;
      if(!was){p.squash=impact>3?7:4;if(impact>3.5)dust(p.x,p.y,4);}
      if(p.slam){p.slam=false;slamImpact(p);}
      if(land.bounce){p.vy=-8.4;p.onGround=false;p.bounced=true;land.squish=12;sfx('bounce');addPop(land.x+15,land.y-8,'BOING!',PAL.yellow);}
    }
  }
}
function slamImpact(p){

    e.dead=true;sfx('defeat');
    feathers(e.x,e.type==='moth'?e.y:e.y-8,12,[PAL.white,PAL.lgray,PAL.pink]);
    addScore({goon:100,tosser:150,moth:120}[e.type],e.x,e.type==='moth'?e.y-8:e.y-24);
    if(P&&P.hp<MAX_HP&&Math.random()<0.3)
      ents.pick.push({type:'heart',x:e.x,y:Math.min(e.y-10,GROUND-5),t:0,fall:true,vy:-2,life:600});
  }

function throwBrick(e){
  var T=48,sx=e.x+e.face*4,sy=e.y-20,g=0.12;
  var vx=clamp((P.x-sx)/T,-2.6,2.6);

function updateEnemy(e){
  e.anim++;if(e.flash>0)e.flash--;
  if(e.hitstun>0){e.hitstun--;e.x+=e.vx;e.vx*=0.85;e.x=clamp(e.x,4,LEVEL_W-4);return;}
  var dx=P.x-e.x;
  if(e.type==='goon'){e.face=dx<0?-1:1;if(Math.abs(dx)>4&&P.dead===0)e.x+=e.face*0.55;}
  else if(e.type==='tosser'){e.face=dx<0?-1:1;e.timer++;if(e.timer>=115){e.timer=0;if(P.dead===0)throwBrick(e);}}
  else if(e.type==='moth'){
    e.mt++;var ty=Math.abs(dx)<130?P.y-12:e.home;
    e.baseY+=clamp(ty-e.baseY,-0.35,0.35);
    e.y=Math.min(e.baseY+Math.sin(e.mt*0.07)*10,GROUND-6);
    if(Math.abs(dx)>2)e.x+=(dx<0?-1:1)*0.5;
    e.face=dx<0?-1:1;
  }
  e.x=clamp(e.x,4,LEVEL_W-4);

function updateBricks(){
  for(var i=ents.bricks.length-1;i>=0;i--){var b=ents.bricks[i];
    b.x+=b.vx;b.vy+=0.12;b.y+=b.vy;b.life--;
    if(b.y>=GROUND-1||b.life<=0){dust(b.x,GROUND,3);ents.bricks.splice(i,1);continue;}
    if(P.dead===0&&overlap(pBox(P),{x:b.x-2,y:b.y-2,w:5,h:4})){hurtPlayer(1,b.x);ents.bricks.splice(i,1);}
  }
}
function updateCush(){
  for(var i=ents.cush.length-1;i>=0;i--){var c=ents.cush[i];
    c.t++;c.x+=c.vx;c.vy+=0.07;c.y+=c.vy;c.life--;
    var dead=c.life<=0||c.y>=GROUND-1||c.x<G.camX-24||c.x>G.camX+W+24,k;
    if(!dead){
      var box={x:c.x-4,y:c.y-3,w:8,h:6};
      if(G.stage==='level'){
        for(k=0;k<ents.enemies.length;k++){var e=ents.enemies[k];
          if(!e.dead&&overlap(box,eBox(e))){hitEnemy(e,1,c.x-c.vx*5);dead=true;break;}}
      }
      if(!dead)for(k=ents.bricks.length-1;k>=0;k--){var b=ents.bricks[k];
        if(overlap(box,{x:b.x-3,y:b.y-3,w:7,h:6})){ents.bricks.splice(k,1);sparks(b.x,b.y,4,[PAL.orange,PAL.brown]);addScore(10,b.x,b.y-6);sfx('brick');dead=true;break;}}
      if(!dead&&G.stage==='boss'&&B&&bossHittable(B)&&overlap(box,bossHurtBox(B))){hitBoss(2,c.x);dead=true;}
    }
    if(dead){feathers(c.x,c.y,5);ents.cush.splice(i,1);}
  }
}
function updatePickups(){
  for(var i=ents.pick.length-1;i>=0;i--){var k=ents.pick[i];k.t++;
    if(k.fall){k.vy+=0.15;k.y+=k.vy;if(k.y>=GROUND-5){k.y=GROUND-5;k.fall=false;}}
    if(k.life>0){k.life--;if(k.life===0){ents.pick.splice(i,1);continue;}}
    if(P&&P.dead===0&&overlap(pBox(P),{x:k.x-4,y:k.y-4,w:8,h:8})){
      if(k.type==='button'){addScore(50,k.x,k.y-8);sfx('pickup');sparks(k.x,k.y,4,[PAL.yellow,PAL.white]);}
      else{if(P.hp<MAX_HP){P.hp++;addPop(k.x,k.y-8,'+1 HEART',PAL.pink);}else addScore(500,k.x,k.y-8);sfx('heart');}
      ents.pick.splice(i,1);
    }
  }
}
function updateParticles(){
  for(var i=ents.parts.length-1;i>=0;i--){var p=ents.parts[i];p.life--;
    if(p.life<=0){ents.parts.splice(i,1);continue;}
    if(p.type==='feather'){p.vy+=0.04;if(p.vy>0.5)p.vy=0.5;p.vx*=0.96;p.x+=p.vx+Math.sin((p.life+p.x)*0.15)*0.3;p.y+=p.vy;if(p.y>GROUND+6)p.y=GROUND+6;}
    else if(p.type==='dust'){p.vx*=0.9;p.vy*=0.92;p.x+=p.vx;p.y+=p.vy;}
    else{p.vy+=0.15;p.x+=p.vx;p.y+=p.vy;if(p.y>GROUND){p.y=GROUND;p.vy*=-0.4;}}
  }
  for(var j=ents.pops.length-1;j>=0;j--){var q=ents.pops[j];q.t++;q.y-=0.4;if(q.t>55)ents.pops.splice(j,1);}
}

function updateLevel(){
  G.time++;
  updatePlayer(P,LV.solid,20,LEVEL_W-20);
  var tx=clamp(P.x-140,0,LEVEL_W-W);G.camX+=(tx-G.camX)*0.2;if(Math.abs(tx-G.camX)<0.5)G.camX=tx;
  var i,e;
  for(i=0;i<LV.sofas.length;i++)if(LV.sofas[i].squish>0)LV.sofas[i].squish--;

    if(!e.dead&&Math.abs(e.x-(G.camX+W/2))<W/2+70)updateEnemy(e);}
  updateBricks();updateCush();
  if(P.dead===0){
    var pb=pBox(P);
    if(punchActive(P)){var hb=punchBox(P);
      for(i=0;i<ents.enemies.length;i++){e=ents.enemies[i];
        if(!e.dead&&e.lastHit!==P.atkId&&overlap(hb,eBox(e))){e.lastHit=P.atkId;hitEnemy(e,2,P.x);}}

// ---------------------------------------------------------------- RED HULK
function newBoss(){return{x:240,y:-90,vy:0,vx:0,face:-1,hp:BOSS_HP,state:'intro',t:0,flash:0,angry:false,last:'',
  tx:240,sx:240,enr:false,pendingEnrage:false,anim:0,jolt:0,hits:0};}
function bossSet(b,s){b.state=s;b.t=0;}
function bossHurtBox(b){
  if(b.state==='charge')return{x:b.x-21,y:b.y-36,w:42,h:36};
  if(b.state==='leapWind')return{x:b.x-21,y:b.y-40,w:42,h:40};
  return{x:b.x-22,y:b.y-48,w:44,h:48};
}
function bossHarmBox(b){
  if(b.state==='charge')return{x:b.x-16,y:b.y-32,w:32,h:32};
  return{x:b.x-12,y:b.y-40,w:24,h:40};
}
var NO_HIT=['intro','roar','dying','sleep'];
function bossHittable(b){return NO_HIT.indexOf(b.state)<0;}
// Only his CHARGE and the landing of his LEAP hurt on contact; walking into him just nudges you back.
function bossHarmful(b){
  if(b.state==='charge')return true;
  if(b.state==='leap')return b.t>=(b.angry?44:54)*0.7&&!platUnderPlayer(); // never swats you off a girder
  return false;
}
function spawnWave(x,dir,spd,life,h){ents.waves.push({x:x,dir:dir,spd:spd,life:life,h:h,t:0});}
function doSlam(b){
  var A=b.angry;
  spawnWave(b.x-20,-1,A?3.0:2.4,200,12);spawnWave(b.x+20,1,A?3.0:2.4,200,12);
  shake(14,3);sfx('slam');dust(b.x-18,GROUND,6);dust(b.x+18,GROUND,6);
}
function platUnderPlayer(){
  if(!P.onGround||P.y>=GROUND-1)return null;
  for(var i=0;i<ARENA_PLATS.length;i++){var p=ARENA_PLATS[i];if(Math.abs(P.y-p.y)<2&&P.x>p.x-6&&P.x<p.x+p.w+6)return p;}
  return null;
}
function leapTarget(){
  var p=platUnderPlayer();
  if(p)return p.x+p.w/2<W/2?p.x+p.w+28:p.x-28; // floor beside the girder, toward the arena centre
  return clamp(P.x,BOSS_MINX+4,BOSS_MAXX-4);
}
function chooseAttack(b){
  var d=Math.abs(P.x-b.x),onPlat=P.onGround&&P.y<GROUND-1,opts;
  if(onPlat)opts=['slam','charge','leap','slam'];
  else if(d>110)opts=['charge','charge','leap','slam'];
  else if(d<50)opts=['slam','slam','leap','charge'];
  else opts=['charge','leap','slam'];
  var f=opts.filter(function(o){return o!==b.last;});if(f.length)opts=f;
  var a=pick(opts);b.last=a;bossSet(b,a+'Wind');
}
function updateBoss(b){
  b.t++;if(b.flash>0)b.flash--;if(b.jolt>0)b.jolt--;
  var dx=P.x-b.x,A=b.angry,i;
  if(A&&b.t%9===0&&b.state!=='dying'&&b.state!=='sleep')addPart(b.x+rnd(-5,5),b.y-50,rnd(-0.3,0.3),-0.7,30,PAL.lgray,'dust');
  switch(b.state){
    case 'intro':
      b.vy+=0.35;b.y+=b.vy;
      if(b.y>=GROUND){b.y=GROUND;b.vy=0;shake(14,4);sfx('slam');dust(b.x,GROUND,18);bossSet(b,'roar');}
      break;
    case 'roar':
      if(b.t===14){sfx('roar');shake(45,2);}
      if(b.t>=120){bossSet(b,'idle');G.control=true;}
      break;
    case 'idle':
      if(b.pendingEnrage){bossSet(b,'enrage');break;}
      b.face=dx<0?-1:1;
      if(Math.abs(dx)>34){b.x+=b.face*(A?0.75:0.5);b.anim++;if(b.anim%16===0)sfx('rock');}
      if(b.t>=(A?36:64))chooseAttack(b);
      break;
    case 'chargeWind':
      if(b.t===1){b.face=dx<0?-1:1;sfx('growl');}
      if(b.t%6===0)dust(b.x-b.face*14,GROUND,2);
      if(b.t>=(A?34:52)){bossSet(b,'charge');b.vx=b.face*(A?4.6:3.8);sfx('charge');}
      break;
    case 'charge':
      b.x+=b.vx;if(b.t%3===0)dust(b.x-b.face*14,GROUND,1);
      if(b.x<=BOSS_MINX||b.x>=BOSS_MAXX){
        b.x=clamp(b.x,BOSS_MINX,BOSS_MAXX);bossSet(b,'stunned');shake(18,4);sfx('slam');
        sparks(b.x+b.face*16,GROUND-30,10,[PAL.lgray,PAL.yellow]);
        if(A)for(i=0;i<3;i++)ents.rocks.push({x:rnd(40,280),y:-12,vy:0,warn:50+i*16});
      }
      break;
    case 'stunned':
      if(b.pendingEnrage&&b.t>20){bossSet(b,'enrage');break;}
      if(b.t>=(A?60:90))bossSet(b,'idle');
      break;
    case 'slamWind':
      if(b.t===1)sfx('warn');
      if(b.t>=(A?30:46)){doSlam(b);bossSet(b,'slam');}
      break;
    case 'slam':
      if(A&&b.t===26)doSlam(b);
      if(b.t>=(A?50:36))bossSet(b,'recover');
      break;
    case 'leapWind':
      if(b.t===1)sfx('warn');
      b.tx=leapTarget();b.face=dx<0?-1:1;
      if(b.t>=(A?26:38)){bossSet(b,'leap');b.sx=b.x;sfx('leap');}
      break;
    case 'leap':
      var T=A?44:54,k=Math.min(1,b.t/T);
      b.x=b.sx+(b.tx-b.sx)*k;b.y=GROUND-Math.sin(Math.PI*k)*92;
      if(b.t>=T){
        b.x=b.tx;b.y=GROUND;shake(14,4);sfx('slam');dust(b.x,GROUND,14);
        spawnWave(b.x-16,-1,2.2,32,10);spawnWave(b.x+16,1,2.2,32,10);
        if(A&&Math.random()<0.45){bossSet(b,'slamWind');b.t=10;}else bossSet(b,'recover');
      }
      break;
    case 'recover':
      if(b.pendingEnrage){bossSet(b,'enrage');break;}
      if(b.t>=(A?28:48))bossSet(b,'idle');
      break;
    case 'enrage':
      if(b.t===1){sfx('roar');shake(50,3);b.pendingEnrage=false;b.enr=true;ents.waves=[];
        G.msg={s:'RED HULK IS ANGRY!',t:110};
        ents.pick.push({type:'heart',x:160,y:20,t:0,fall:true,vy:0,life:900});}
      if(b.t===24&&Math.abs(dx)<60&&P.dead===0&&P.y>=GROUND-1){P.vx=(dx<0?-1:1)*2.2;P.vy=-2;P.onGround=false;P.hurt=10;}
      if(b.t%6===0)sparks(b.x,b.y-30,3,[PAL.orange,PAL.yellow,PAL.red]);
      if(b.t>=90){b.angry=true;bossSet(b,'idle');}
      break;
    case 'dying':
      if(b.t%7===0){feathers(b.x+rnd(-14,14),b.y-rnd(8,40),6,[PAL.white,PAL.pink,PAL.red]);sfx('bossHit');}
      if(b.t%20===0)shake(6,2);
      if(b.t>=130){bossSet(b,'sleep');b.x=clamp(b.x,52,268);b.face=1;sfx('defeat');feathers(b.x,b.y-10,30,[PAL.pink,PAL.white,PAL.lav]);}
      break;
    case 'sleep':
      if(b.t%45===0)addPop(b.x+22,b.y-30,'Z',PAL.white);
      if(b.t>=150)victory();
      break;
  }
  if(b.state!=='sleep')b.x=clamp(b.x,BOSS_MINX,BOSS_MAXX);
}
var HIT_WORDS=['POW!','FWUMP!','BOP!','PUFF!','WHUMP!'];
function hitBoss(d,srcx,word){
  if(!B||!bossHittable(B))return;
  B.hp-=d;B.flash=10;B.jolt=6;B.hits=(B.hits||0)+1;sfx('bossHit');shake(4,1);
  var hx=clamp(srcx,B.x-18,B.x+18);
  sparks(hx,B.y-26,10,[PAL.white,PAL.yellow,PAL.orange]);feathers(hx,B.y-26,4,[PAL.white,PAL.pink]);
  addScore(25*d);
  addPop(hx,B.y-58,word||pick(HIT_WORDS),PAL.white);addPop(hx,B.y-50,'-'+d,PAL.orange);
  if(B.hp<=0){B.hp=0;bossSet(B,'dying');B.y=GROUND;ents.waves=[];ents.rocks=[];AU.stop();sfx('roar');G.control=true;shake(30,3);
    G.msg={s:'K.O.!',t:120};}
  else if(!B.enr&&B.hp<=BOSS_HP/2)B.pendingEnrage=true;
}
function updateWaves(){
  for(var i=ents.waves.length-1;i>=0;i--){var w=ents.waves[i];
    w.x+=w.dir*w.spd;w.life--;w.t++;
    if(w.t%3===0)addPart(w.x,GROUND-2,rnd(-0.5,0.5),rnd(-1.5,-0.5),14,pick([PAL.orange,PAL.yellow,PAL.lgray]),'spark');
    if(w.life<=0||w.x<12||w.x>308){ents.waves.splice(i,1);continue;}
    if(P.dead===0&&P.y>GROUND-w.h&&Math.abs(P.x-w.x)<8)hurtPlayer(1,w.x-w.dir*20);
  }
}
function updateRocks(){
  for(var i=ents.rocks.length-1;i>=0;i--){var r=ents.rocks[i];
    if(r.warn>0){r.warn--;continue;}
    r.vy+=0.25;r.y+=r.vy;
    if(P.dead===0&&overlap(pBox(P),{x:r.x-4,y:r.y-8,w:8,h:8}))hurtPlayer(1,r.x);
    if(r.y>=GROUND){dust(r.x,GROUND,6);sparks(r.x,GROUND-3,5,[PAL.dgray,PAL.lgray]);sfx('rock');ents.rocks.splice(i,1);}
  }
}
function updateBossStage(){
  G.time++;
  updatePlayer(P,ARENA_PLATS,ARENA_MIN,ARENA_MAX);
  updateBoss(B);
  if(B.state==='intro'||B.state==='roar')G.barFill=Math.min(B.hp,G.barFill+0.6);else G.barFill=B.hp;
  updateWaves();updateRocks();updateCush();updatePickups();updateParticles();
  if(P.dead===0){
    if(punchActive(P)&&P.lastBossHit!==P.atkId&&bossHittable(B)&&overlap(punchBox(P),bossHurtBox(B))){
      P.lastBossHit=P.atkId;hitBoss(4,P.x+P.face*14);}
    if(overlap(pBox(P),bossHarmBox(B))){
      if(bossHarmful(B))hurtPlayer(1,B.x);
      else if(B.state!=='intro'&&B.state!=='dying'&&B.state!=='sleep'){ // no damage: just a soft nudge out of his body
        P.x=clamp(P.x+(P.x<B.x?-1.2:1.2),ARENA_MIN,ARENA_MAX);}
    }
  }
}
function victory(){
  G.state='victory';G.st=0;
  var lifeB=G.lives*1000,timeB=Math.max(0,Math.round((360-G.time/60)))*10;
  G.bonus={life:lifeB,time:timeB};G.score+=lifeB+timeB;if(G.score>G.hi)G.hi=G.score;saveHi();
  AU.play('victory');
}

// ---------------------------------------------------------------- main update
var STORY=['PILLOW CITY, 1986.','','THE RAMPAGING RED HULK HAS STOLEN','EVERY PILLOW IN TOWN!','',
  'NOBODY CAN GET A WINK OF SLEEP...','','ONLY ONE HERO IS SOFT ENOUGH','AND MIGHTY ENOUGH TO STOP HIM:','','CUSHIONMAN!'];
var STORY_LEN=STORY.join('').length;
function togglePause(){G.paused=!G.paused;AU.paused=G.paused;sfx('pause');}
function update(){
  pressedNow=queued;queued={};
  G.t++;
  if(G.muteMsg>0)G.muteMsg--;
  if(G.trans){G.trans.t++;if(G.trans.t===G.trans.dur)G.trans.cb();
    if(G.trans.t>=G.trans.dur*2)G.trans=null;else if(G.trans.t<=G.trans.dur)return;}
  if(G.shakeT>0)G.shakeT--;
  if(G.msg&&!G.paused){G.msg.t--;if(G.msg.t<=0)G.msg=null;}
  var go=pressed('start')||pressed('jump');
  switch(G.state){
    case 'title':
      G.st++;
      if(pressed('debug')){sfx('select');newGame();fadeTo(startBoss);}
      else if(go){sfx('select');newGame();fadeTo(startStory);}
      break;
    case 'story':
      G.st++;
      if(go||pressed('attack')){
        if(G.st/1.5<STORY_LEN)G.st=Math.ceil(STORY_LEN*1.5)+1;else{sfx('select');fadeTo(startLevel);}
      }else if(G.st>STORY_LEN*1.5+300)fadeTo(startLevel);
      break;
    case 'level':
      if(pressed('pause')||pressed('esc'))togglePause();
      if(!G.paused)updateLevel();
      break;
    case 'boss':
      if(pressed('pause')||pressed('esc'))togglePause();
      if(!G.paused)updateBossStage();
      break;
    case 'victory':
      G.st++;updateParticles();if(B)B.t++;
      if(B&&B.t%45===0)addPop(B.x+22,B.y-30,'Z',PAL.white);
      if(G.st>60&&pressed('start')){sfx('select');fadeTo(function(){newGame();startLevel();});}
      break;
    case 'gameover':
      G.st++;
      if(G.st>40&&pressed('start')){sfx('select');fadeTo(function(){
        G.lives=3;G.score=0;if(G.over==='boss')startBoss();else startLevel();});}
      else if(G.st>40&&pressed('esc')){sfx('pause');fadeTo(toTitle);}
      break;
  }
}

// ---------------------------------------------------------------- sprites
function drawCushionman(x,y,f,o){
  x=Math.round(x);y=Math.round(y);
  var sq=o.squash?1:0,t=o.t||0,step=o.step||0,air=!!o.air,bob=o.bob||0;
  var top=y+sq+bob,wave=(t>>3)&1;
  // cape
  if(o.glide){
    FR(x,top,f,-9,-31,18,2,PAL.blue);FR(x,top,f,-11,-29,4,2,PAL.blue);FR(x,top,f,7,-29,4,2,PAL.blue);
    FR(x,top,f,-7,-30,14,1,PAL.dblue);
    FR(x,top,f,-10,-27,1,10,PAL.lgray);FR(x,top,f,9,-27,1,10,PAL.lgray);
  }else{
    var cl=Math.min(7,4+(o.moving?2:0)+(air?2:0));
    FR(x,top,f,-6-cl,-15,cl+1,3,PAL.blue);
    FR(x,top,f,-5-cl-wave,-12,cl,3,PAL.blue);
    FR(x,top,f,-4-cl,-9,cl-1,2,PAL.dblue);
  }
  // legs
  function leg(lx,lift){FR(x,y,f,lx,-6-lift,3,4,PAL.navy);FR(x,y,f,lx,-2-lift,4,2,PAL.red);}
  if(o.slam){leg(-4,2);leg(1,2);}
  else if(air){leg(-4,1);leg(1,2);}
  else{var o1=[0,2,0,-2][step];leg(-4-o1,o1>0?1:0);leg(1+o1,o1<0?1:0);}
  // cushion body
  FR(x,top,f,-6,-16,12,11,PAL.pink);FR(x,top,f,-7,-15,14,9,PAL.pink);
  if(sq)FR(x,top,f,-8,-14,16,7,PAL.pink);
  FR(x,top,f,-5,-15,4,1,PAL.white);FR(x,top,f,-6,-14,1,3,PAL.white);
  FR(x,top,f,-6,-6,12,1,PAL.dpink);FR(x,top,f,6,-13,1,7,PAL.dpink);
  FR(x,top,f,-1,-12,2,2,PAL.lav);FR(x,top,f,-1,-12,1,1,PAL.white);
  FR(x,top,f,-4,-10,1,1,PAL.dpink);FR(x,top,f,3,-10,1,1,PAL.dpink);
  var tw=sq?1:0;
  FR(x,top,f,-8-tw,-16,2,2,PAL.yellow);FR(x,top,f,6+tw,-16,2,2,PAL.yellow);
  FR(x,top,f,-8-tw,-7,2,2,PAL.yellow);FR(x,top,f,6+tw,-7,2,2,PAL.yellow);
  FR(x,top,f,-8-tw,-5+wave,1,1,PAL.orange);FR(x,top,f,7+tw,-5+wave,1,1,PAL.orange);
  // head

    else if(p.type==='feather')R(p.x,p.y,2,1,p.c);
    else R(p.x,p.y,1,1,p.c);}
  for(var j=0;j<ents.pops.length;j++){var q=ents.pops[j];if(q.t>40&&(q.t&2))continue;text(q.s,q.x,q.y,q.c,1,'c',PAL.black);}

function setCam(camX){

// ---------------------------------------------------------------- scene renderers

  var cx=(G.t*0.4)%(LEVEL_W-W);
  drawCity(cx,true);
  ctx.globalAlpha=0.6;R(0,18,W,74,PAL.night);ctx.globalAlpha=1;

  var s='CUSHIONMAN',sc=3,w=s.length*6*sc-sc,x0=Math.round((W-w)/2);

    var oy=Math.round(Math.sin(G.t*0.08+i*0.55)*2),lx=x0+i*6*sc,ly=23+oy,ch=s.charAt(i);
    bigStr(ch,lx+2,ly+2,PAL.plum,sc);bigStr(ch,lx,ly+1,PAL.dpink,sc);bigStr(ch,lx,ly,PAL.pink,sc);
    ctx.fillStyle=PAL.white;ctx.fillRect(lx+sc,ly,sc,1);
  }
  text('VS',W/2,50,PAL.white,2,'c',PAL.black);

  var flex=((G.t>>6)&1)===1;
  drawHulk(262,GROUND,-1,{arms:flex?'flex':'down',mouth:flex});
  ctx.globalAlpha=0.8;R(0,158,W,22,PAL.night);ctx.globalAlpha=1;

  text('P PAUSE   M MUTE',W/2,174,PAL.lgray,1,'c',PAL.black);
  text('HI '+pad(G.hi,6),4,4,PAL.white,1,'l',PAL.black);
  text('(C) 1986 PILLOWSOFT',W-4,4,PAL.lgray,1,'r',PAL.black);
}
function drawStory(){
  R(0,0,W,H,PAL.night);
  for(var i=0;i<STARS.length;i++){var s=STARS[i];if(((G.t+s.p)>>4)%5===0)continue;R(s.x,s.y+40,1,1,s.c);}
  var shown=Math.floor(G.st/1.5),used=0;
  for(var l=0;l<STORY.length;l++){
    var line=STORY[l];if(used>shown)break;
    var part=line.substr(0,Math.max(0,shown-used));used+=line.length;
    var last=l===STORY.length-1;
    if(part.length)text(part,W/2-(line.length*4-1)/2,14+l*11,last?PAL.pink:PAL.white,1,'l',PAL.plum);
  }
  if(shown>=STORY_LEN){
    drawCushionman(W/2,152,1,{t:G.t,bob:(G.t>>4)&1});
    if((G.t>>4)&1)text('PRESS ENTER',W/2,160,PAL.yellow,1,'c',PAL.black);
  }else text('ENTER: SKIP',W-4,H-8,PAL.lgray,1,'r');
}
function drawLevelScene(){
  drawCity(G.camX);
  setCam(G.camX);
  var i;
  R(50,GROUND-36,2,36,PAL.dgray);R(30,GROUND-46,44,12,PAL.green);R(31,GROUND-45,42,1,PAL.lime);
  text('PILLOW CITY',52,GROUND-43,PAL.white,1,'c');
  var cpx=LEVEL_DEF.checkpoint;R(cpx,GROUND-40,2,40,PAL.lgray);
  var wv=(G.t>>3)&1;R(cpx+2,GROUND-40+wv,13,8,G.cpReached?PAL.pink:PAL.dgray);R(cpx+14,GROUND-41+wv,2,2,PAL.yellow);R(cpx+14,GROUND-33+wv,2,2,PAL.yellow);
  R(GATE_X-2,GROUND-34,2,34,PAL.dgray);R(GATE_X+40,GROUND-34,2,34,PAL.dgray);
  R(GATE_X-14,GROUND-56,68,22,PAL.yellow);R(GATE_X-12,GROUND-54,64,18,PAL.black);R(GATE_X-11,GROUND-53,62,16,PAL.yellow);
  text('DANGER!',GATE_X+20,GROUND-51,PAL.red,1,'c');text('HULK ZONE ->',GATE_X+20,GROUND-43,PAL.black,1,'c');
  for(i=0;i<LV.plats.length;i++)drawPlank(LV.plats[i]);
  for(i=0;i<LV.sofas.length;i++)drawSofa(LV.sofas[i]);
  for(i=0;i<ents.pick.length;i++)drawPickup(ents.pick[i]);
  for(i=0;i<ents.enemies.length;i++){var e=ents.enemies[i];if(e.x<G.camX-30||e.x>G.camX+W+30)continue;
    if(e.type==='moth')drawMoth(e);else drawGoon(e);}
  for(i=0;i<ents.bricks.length;i++){var b=ents.bricks[i];R(b.x-2,b.y-1,5,3,PAL.brown);R(b.x-2,b.y,5,1,PAL.dbrown);}
  for(i=0;i<ents.cush.length;i++)drawCushProj(ents.cush[i]);
  drawPlayer(P);
  drawParticles();
  resetCam();
  drawHUD();
}
function drawBossScene(){
  drawArena();
  setCam(0);
  var i;
  for(i=0;i<ents.rocks.length;i++){var r=ents.rocks[i];
    if(r.warn>0){if((r.warn>>2)&1){ctx.globalAlpha=0.5;R(r.x-5,GROUND-1,10,2,PAL.black);ctx.globalAlpha=1;R(r.x-1,GROUND-8,2,4,PAL.yellow);}}
    else{ctx.globalAlpha=0.4;R(r.x-5,GROUND-1,10,2,PAL.black);ctx.globalAlpha=1;
      R(r.x-4,r.y-8,8,8,PAL.dgray);R(r.x-3,r.y-8,4,1,PAL.lgray);R(r.x-4,r.y-7,1,3,PAL.lgray);}}
  for(i=0;i<ents.pick.length;i++)drawPickup(ents.pick[i]);
  if(B)drawBoss(B);
  for(i=0;i<ents.waves.length;i++){var w=ents.waves[i],x=Math.round(w.x),fl=(w.t>>1)&1;
    R(x-4,GROUND-w.h+3,2,w.h-3,PAL.red);R(x-2,GROUND-w.h-fl,3,w.h+fl,PAL.orange);R(x+1,GROUND-w.h+2,2,w.h-2,PAL.yellow);
    R(x-6,GROUND-3,12,3,PAL.orange);}
  for(i=0;i<ents.cush.length;i++)drawCushProj(ents.cush[i]);

    bigText('RED HULK',W/2+sl,59,PAL.red,3,'c',PAL.yellow);
    text('- THE CRIMSON CRUSHER -',W/2-sl,82,PAL.white,1,'c');
  }
  drawHUD();
}
function drawVictory(){
  ctx.globalAlpha=0.75;R(28,22,264,104,PAL.night);ctx.globalAlpha=1;
  R(28,22,264,1,PAL.pink);R(28,125,264,1,PAL.pink);R(28,22,1,104,PAL.pink);R(291,22,1,104,PAL.pink);

function drawGameOver(){
  R(0,0,W,H,PAL.night);
  bigText('GAME OVER',W/2,40,PAL.red,3,'c',PAL.plum);
  R(146,104,28,5,PAL.pink);R(144,105,32,3,PAL.pink);R(145,103,2,2,PAL.yellow);R(173,103,2,2,PAL.yellow);

function drawPause(){
  ctx.globalAlpha=0.55;R(0,0,W,H,PAL.black);ctx.globalAlpha=1;
  bigText('PAUSED',W/2,62,PAL.white,3,'c',PAL.plum);
  text('P / ESC TO RESUME',W/2,90,PAL.yellow,1,'c');
  text('M TO '+(AU.muted?'UNMUTE':'MUTE'),W/2,100,PAL.lgray,1,'c');
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;FLASH=null;
  switch(G.state){
    case 'title':drawTitle();break;
    case 'story':drawStory();break;
    case 'level':drawLevelScene();break;
    case 'boss':drawBossScene();break;
    case 'victory':drawBossScene();drawVictory();break;
    case 'gameover':drawGameOver();break;
  }
  if(G.paused&&(G.state==='level'||G.state==='boss'))drawPause();
  G.soundLabel=AU.muted?'MUTED - M FOR SOUND':(G.muteMsg>0?'SOUND ON':'');
  if(G.soundLabel)text(G.soundLabel,W-4,H-8,AU.muted?PAL.orange:PAL.lgray,1,'r',PAL.black);
  if(G.trans){var tr=G.trans,a=tr.t<=tr.dur?tr.t/tr.dur:1-(tr.t-tr.dur)/tr.dur;
    ctx.globalAlpha=clamp(a,0,1);R(0,0,W,H,PAL.black);ctx.globalAlpha=1;}
  sctx.setTransform(1,0,0,1,0,0);sctx.imageSmoothingEnabled=false;
  sctx.drawImage(buf,0,0,screen.width,screen.height);
  if(scale>=3){sctx.fillStyle='rgba(0,0,0,0.16)';
    for(var y=0;y<H;y++)sctx.fillRect(0,Math.round(y*scale+scale-1),screen.width,1);}
}

// ---------------------------------------------------------------- main loop
var lastTs=0,acc=0;
function frame(ts){
  window.requestAnimationFrame(frame);
  if(!lastTs)lastTs=ts;
  var dt=ts-lastTs;lastTs=ts;if(dt>250)dt=250;if(dt<0)dt=0;
  acc+=dt;var n=0;
  while(acc>=STEP_MS&&n<5){update();acc-=STEP_MS;n++;}
  if(n>=5)acc=0;
  AU.update();
  render();
}
toTitle();
window.requestAnimationFrame(frame);

// harmless read-only introspection hook (used by automated tests; does nothing on its own)
window.CUSHIONMAN={get G(){return G;},get P(){return P;},get B(){return B;},get ents(){return ents;},
  songs:SONGS,missingGlyphs:missingGlyphs,BOSS_HP:BOSS_HP,ARENA_MIN:ARENA_MIN,ARENA_MAX:ARENA_MAX,
  get muted(){return AU.muted;},get masterLevel(){return AU.master?AU.masterLevel:null;},LEVEL:LEVEL_DEF,GATE_X:GATE_X,GROUND:GROUND};
})();
